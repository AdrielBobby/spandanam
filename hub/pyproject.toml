[project]
name = "vaaythari"
version = "0.1.0"
description = "Vaaythari: an offline Gemma 3n chenda asan that chants, taps, hears, corrects and composes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "sounddevice>=0.4", "httpx>=0.27", "rich>=13", "google-genai>=1.0",
  "gpiozero>=2; platform_machine=='aarch64'", "smbus2>=0.4; platform_machine=='aarch64'",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
