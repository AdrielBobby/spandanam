[project]
name = "thaalam"
version = "0.1.0"
description = "Thaalam: 5-finger air-percussion glove with real-time feedback; Gemma 3n on-device structures rhythm into finger thaalam, Gemini composes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "librosa>=0.10", "soundfile>=0.12", "sounddevice>=0.4", "httpx>=0.27",
  "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "python-multipart>=0.0.9", "google-genai>=1.0",
  "gpiozero>=2; platform_machine=='aarch64'", "smbus2>=0.4; platform_machine=='aarch64'",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", ".."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asan", "viral"]

[tool.setuptools.package-data]
viral = ["static/*"]

