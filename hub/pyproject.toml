[project]
name = "melam-asan"
version = "0.1.0"
description = "On-device Gemma conductor for chenda melam: sync, kaalam tracking, fatigue safety, haptic coaching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "rich>=13",
  "httpx>=0.27",
  "google-genai>=1.0",
  "pydantic>=2",
  "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
