[project]
name = "spandanam"
version = "0.1.0"
description = "Feel the chenda melam: on-device Gemma turns live ensemble audio into a haptic body score for deaf listeners"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "sounddevice>=0.4", "httpx>=0.27", "rich>=13", "google-genai>=1.0"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
