<!doctype html><html><head><meta charset="utf-8"><title>Thaalam</title>
<style>
:root{--bg:#0a0a0a;--fg:#f2f2f2;--acc:#ffd60a;--mut:#666}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 "Space Grotesk",system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid #222}
h1{font-size:22px;margin:0;letter-spacing:-.5px}h1 span{color:var(--acc)}
.tabs button{background:#161616;color:var(--fg);border:1px solid #333;padding:8px 14px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#000;border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px 20px}
#lanes{position:relative;height:520px;background:#111;border:1px solid #222;border-radius:12px;overflow:hidden}
.lane{position:absolute;top:0;bottom:0;width:20%;border-right:1px solid #1d1d1d}
.hitline{position:absolute;left:0;right:0;bottom:70px;height:2px;background:#444}
.note{position:absolute;width:16%;left:2%;height:18px;border-radius:6px;opacity:.95}
.pad{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex}
.pad div{flex:1;margin:6px;border-radius:10px;background:#1a1a1a;border:2px solid #333;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#aaa;transition:transform .05s}
.pad div.hit{transform:scale(.94);filter:brightness(1.6)}
.pad b{font-size:14px;color:#fff}.pad small{color:#777}
#judge{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:34px;font-weight:700;opacity:0;transition:opacity .15s}
#stats{position:absolute;top:12px;right:14px;text-align:right;color:#bbb;font-size:13px}#stats b{color:var(--acc);font-size:20px}
aside .card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;color:#999;font-size:12px;margin-top:8px}input,select{width:100%;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:8px;padding:8px;margin-top:4px}
button.primary{width:100%;margin-top:10px;background:var(--acc);color:#000;border:0;padding:10px;border-radius:8px;font-weight:700;cursor:pointer}
button.ghost{width:100%;margin-top:6px;background:#1a1a1a;color:#fff;border:1px solid #333;padding:8px;border-radius:8px;cursor:pointer}
#coach{white-space:pre-wrap;color:#ddd}.ml{font-family:"Noto Sans Malayalam","Manjari","Malayalam Sangam MN",system-ui,sans-serif;color:#bbb;font-size:13px}.mlbig{font-family:"Noto Sans Malayalam","Manjari","Malayalam Sangam MN",system-ui,sans-serif;font-size:17px;color:#fff;line-height:1.6}.en{color:#999;font-size:13px;margin-top:6px}
.hidden{display:none}#status{color:var(--mut);font-size:12px}
.eng{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #333;border-radius:8px;cursor:pointer;background:#0d0d0d}
.eng.on{border-color:var(--acc);background:#1a1700}.eng b{color:#fff}.badge{font-size:10px;padding:2px 6px;border-radius:999px;background:#222;color:#bbb}
.badge.dev{background:#0a3d1a;color:#7ee2a0}.badge.lap{background:#1b2a4a;color:#8fb8ff}.badge.down{background:#4a1b1b;color:#ff9d9d}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side>div{background:#0d0d0d;border:1px solid #222;border-radius:8px;padding:10px}
.side h4{margin:0 0 6px 0;font-size:12px;color:#aaa;display:flex;gap:6px;align-items:center}
.click{position:absolute;bottom:0;height:64px;width:20%;background:rgba(255,214,10,.15);pointer-events:none}
</style></head><body>
<header><h1>Thaa<span>lam</span></h1>
<div class="tabs"><button id="tFree" class="on">Free flow · <span class="ml">സ്വതന്ത്രം</span></button><button id="tLearn">Learn · <span class="ml">പഠിക്കൂ</span></button><button id="tPractice">Practice · <span class="ml">പരിശീലനം</span></button></div>
<span id="status"></span><span style="margin-left:auto;color:#777;font-size:12px">keys: SPACE=thumb (or IMU) · J K L ; = index→pinky · <span class="ml">തള്ളവിരൽ · ചൂണ്ടുവിരൽ · നടുവിരൽ · മോതിരവിരൽ · ചെറുവിരൽ</span></span></header>
<main>
<section id="lanes">
  <div id="judge"></div><div id="stats"><b id="pts">0</b> pts · streak <span id="streak">0</span></div>
  <div class="hitline"></div><div class="pad" id="pad"></div>
</section>
<aside>
  <div class="card" id="cFree"><h3>Free flow · <span class="ml">സ്വതന്ത്രമായി വായിക്കൂ</span></h3>
    <label>Instrument</label><select id="kit"></select>
    <label>Tempo (bpm) <span id="bpmv">90</span></label><input id="bpm" type="range" min="40" max="200" value="90">
    <label>Cycle beats</label><select id="cycle"><option>4</option><option>6</option><option>7</option><option selected>8</option><option>14</option></select>
    <label>Tempo on fingers</label><select id="click"><option value="walk">walk thumb→pinky</option><option value="all">all fingers</option><option value="downbeat">downbeat only</option></select>
    <button class="primary" id="goFree">Start tempo · താളം തുടങ്ങൂ</button><button class="ghost" id="stop">Stop · നിർത്തൂ</button></div>
  <div class="card hidden" id="cLearn"><h3>Learn a track · <span class="ml">ഒരു താളം പഠിക്കൂ</span></h3>
    <label>Audio (mp3/wav)</label><input type="file" id="file" accept="audio/*"><button class="primary" id="upload">Analyze with Gemma · വിശകലനം ചെയ്യൂ</button>
    <hr style="border-color:#222"><label>…or compose with Gemini</label><input id="brief" placeholder="playful Onam melam, builds to a kalasham">
    <select id="ckit"></select><button class="ghost" id="compose">Compose · രചിക്കൂ</button>
    <hr style="border-color:#222"><label>…or type a vaaythari phrase</label><input id="phraseText" placeholder="dhim tha ka ta ki" value="dhim tha ka ta ki"><button class="ghost" id="loadPhrase">Load phrase</button>
    <div id="scoreInfo" style="margin-top:10px;color:#bbb;font-size:13px"></div></div>
  <div class="card hidden" id="cPractice"><h3>Practice · <span class="ml">പരിശീലനം</span></h3>
    <label>Phrase</label><select id="phrase"><option value="">whole piece</option></select>
    <label>Speed</label><select id="speed"><option value="0.6">60%</option><option value="0.8">80%</option><option value="1" selected>100%</option></select>
    <button class="ghost" id="goListen">▶ Listen · കേൾക്കൂ</button>
    <button class="primary" id="goPractice">Play · വായിക്കൂ</button><button class="ghost" id="stop2">Stop · നിർത്തൂ</button>
    <div id="summary" style="margin-top:10px;color:#bbb;font-size:13px"></div></div>
  <div class="card" id="cEngine"><h3>Gemma engine <span class="ml" style="font-size:12px">· ഏത് ജെമ്മ?</span></h3>
    <div id="engines" style="display:flex;flex-direction:column;gap:6px;font-size:13px"></div>
    <div id="engineNote" style="color:#777;font-size:12px;margin-top:6px"></div></div>
  <div class="card"><h3>Ashaan says · <span class="ml">ആശാൻ പറയുന്നു</span></h3><div id="coach" class="mlbig">—</div></div>
</aside></main>
<script>
const COLORS=["#ff3b30","#ff9500","#ffd60a","#34c759","#0a84ff"],NAMES=["thumb","index","middle","ring","pinky"];
const KEYS={" ":0,"j":1,"k":2,"l":3,";":4};
let ws,state={},score=null,play=null,fmap={names:NAMES,syllables:["","","","",""]};
const $=s=>document.querySelector(s);
function pad(){$("#pad").innerHTML=NAMES.map((n,i)=>`<div id="p${i}" style="border-color:${COLORS[i]}"><b>${fmap.names[i]||n}</b><small>${fmap.syllables[i]||""}</small></div>`).join("");
 for(let i=0;i<5;i++){const l=document.createElement("div");l.className="lane";l.style.left=(i*20)+"%";$("#lanes").prepend(l);}}
function flash(i){const p=$("#p"+i);if(!p)return;p.classList.add("hit");setTimeout(()=>p.classList.remove("hit"),80);}
function judge(t,c){const j=$("#judge");j.textContent=t;j.style.color=c;j.style.opacity=1;setTimeout(()=>j.style.opacity=0,300);}
function connect(){ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=e=>{const m=JSON.parse(e.data);
 if(m.type==="strike"){flash(m.finger);if(m.judge==="auto"){markNote(m.note,"auto");}else if(m.judge){const map={perfect:["PERFECT · കൃത്യം","#34c759"],good:["GOOD · നല്ലത്","#ffd60a"],late:["LATE · വൈകി","#ff9500"],early:["EARLY · നേരത്തെ","#ff9500"],wrong_finger:["WRONG FINGER · തെറ്റായ വിരൽ","#ff3b30"],extra:["—","#666"]};judge(...map[m.judge]);$("#pts").textContent=m.points;$("#streak").textContent=m.streak;if(m.note!=null)markNote(m.note,m.judge);}}
 else if(m.type==="click"){const c=document.createElement("div");c.className="click";c.style.left=(m.finger*20)+"%";c.style.background=m.down?"rgba(255,214,10,.35)":"rgba(255,255,255,.08)";$("#lanes").appendChild(c);setTimeout(()=>c.remove(),120);}
 else if(m.type==="score"){setScore(m.score);const conf=m.confidence!=null?` · confidence ${Math.round(m.confidence*100)}%`:"";$("#scoreInfo").innerHTML=`${m.score.title} · ${m.score.thaalam} · ${m.score.notes.length} notes · ${Math.round(m.score.bpm)} bpm${conf}<br><span class="mlbig" style="font-size:14px">${m.summary_ml||""}</span><br><span class="en">${m.gemma||""}</span>`;$("#status").textContent=`${m.score.thaalam}${conf}`;$("#tPractice").click();}
 else if(m.type==="practice_start"){startPractice(m.score,m.lead_in_s);}
 else if(m.type==="miss"){m.notes.forEach(i=>markNote(i,"miss"));$("#streak").textContent=0;judge("MISS · വിട്ടുപോയി","#ff3b30");}
 else if(m.type==="practice_end"){play=null;const s=m.summary;$("#summary").innerHTML=`${"★".repeat(s.stars)}${"☆".repeat(3-s.stars)} &nbsp; ${Math.round(s.accuracy*100)}% · ${s.points} pts<br>perfect ${s.perfect} · good ${s.good} · miss ${s.misses} · wrong finger ${s.wrong_finger}`;}
 else if(m.type==="coach"){const one=r=>`<div class="mlbig">${r.say_ml||""}</div><div class="en">${r.say_en||""}</div>${r.say_manglish?`<div class="en" style="color:#777;font-style:italic">${r.say_manglish}</div>`:""}${r.drill_phrase!=null?`<div style="color:#777;font-size:12px;margin-top:6px">drill: phrase ${(+r.drill_phrase)+1} @ ${Math.round(r.drill_bpm||0)} bpm</div>`:""}`;
   const head=r=>`<h4><b>${r.engine||""}</b> <span class="badge ${r.on_device?"dev":"lap"}">${r.on_device?"on-device":"laptop"}</span> <span class="badge">${r.model||""}</span> <span class="badge">${r.seconds!=null?r.seconds+" s":""}</span></h4>`;
   if(m.results&&m.results.length>1){$("#coach").innerHTML=`<div class="side">${m.results.map(r=>`<div>${head(r)}${one(r)}</div>`).join("")}</div>`;}
   else{$("#coach").innerHTML=`${m.engine?head(m):""}${one(m)}`;}}
 else if(m.type==="status"){$("#status").textContent=m.text;}
 else if(m.type==="kit"){$("#status").textContent="kit: "+m.kit;}};ws.onclose=()=>setTimeout(connect,800);}
document.addEventListener("keydown",e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k in KEYS||e.key===" "){e.preventDefault();ws.send(JSON.stringify({type:"key",key:e.key===" "?" ":k,v:.9}));}});
// falling notes
let notesEl=[];function setScore(s){score=s;fmap=s.finger_map;pad();const ph=$("#phrase");ph.innerHTML='<option value="">whole piece</option>'+(s.phrases||[]).map((p,i)=>`<option value="${i}">phrase ${i+1} (beats ${p[0]}–${p[1]})</option>`).join("");}
function startPractice(s,lead){score=s;fmap=s.finger_map;pad();$("#pts").textContent=0;$("#streak").textContent=0;notesEl.forEach(n=>n.remove());notesEl=[];
 const t0=performance.now()+lead*1000,beat=60000/s.bpm;play={t0,beat};
 s.notes.forEach((n,i)=>{const el=document.createElement("div");el.className="note";el.style.left=(n.finger*20+2)+"%";el.style.background=COLORS[n.finger];el.dataset.t=t0+n.beat*beat;el.textContent="";el.title=n.label;$("#lanes").appendChild(el);notesEl.push(el);});requestAnimationFrame(anim);}
function markNote(i,v){const el=notesEl[i];if(!el)return;if(v==="auto"){el.style.boxShadow="0 0 12px #fff";setTimeout(()=>el.style.opacity=.25,120);return;}el.style.opacity=.25;if(v==="miss"||v==="wrong_finger")el.style.background="#333";}
function anim(){if(!play)return;const now=performance.now(),H=$("#lanes").clientHeight-70,speed=H/2000;
 notesEl.forEach(el=>{const dt=+el.dataset.t-now;const y=H-dt*speed;el.style.top=(y-9)+"px";el.style.display=(y<-20||y>H+40)?"none":"block";});requestAnimationFrame(anim);}
// controls
fetch("/api/state").then(r=>r.json()).then(s=>{state=s;for(const id of["kit","ckit"]){$("#"+id).innerHTML=Object.entries(s.kits).map(([k,v])=>`<option value="${k}" ${k===s.kit?"selected":""}>${v.name}</option>`).join("");}if(s.score)setScore(s.score);if(s.dry)$("#status").textContent="dry mode (no GPIO)";});
$("#bpm").oninput=e=>$("#bpmv").textContent=e.target.value;
$("#kit").onchange=e=>ws.send(JSON.stringify({type:"kit",kit:e.target.value}));
$("#goFree").onclick=()=>ws.send(JSON.stringify({type:"free",bpm:+$("#bpm").value,cycle:+$("#cycle").value,click:$("#click").value}));
$("#stop").onclick=$("#stop2").onclick=()=>{ws.send(JSON.stringify({type:"stop"}));play=null;};
$("#upload").onclick=async()=>{const f=$("#file").files[0];if(!f)return;const fd=new FormData();fd.append("file",f);$("#status").textContent="uploading…";const r=await fetch("/api/learn",{method:"POST",body:fd});const j=await r.json();$("#status").textContent=j.ok?`learned ${j.notes} notes · ${j.thaalam}`:"error: "+j.error;};
$("#compose").onclick=async()=>{$("#status").textContent="Gemini composing…";const r=await fetch("/api/compose",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({brief:$("#brief").value,kit:$("#ckit").value,cycles:4,bpm:+$("#bpm").value})});const j=await r.json();$("#status").textContent=j.ok?`composed ${j.notes} notes`:"error: "+j.error;};
$("#loadPhrase").onclick=()=>ws.send(JSON.stringify({type:"phrase",text:$("#phraseText").value,bpm:+$("#bpm").value,cycles:2}));
$("#goListen").onclick=()=>ws.send(JSON.stringify({type:"listen",phrase:$("#phrase").value===""?null:+$("#phrase").value,speed:+$("#speed").value}));
$("#goPractice").onclick=()=>ws.send(JSON.stringify({type:"practice",phrase:$("#phrase").value===""?null:+$("#phrase").value,speed:+$("#speed").value}));
for(const [t,c] of [["tFree","cFree"],["tLearn","cLearn"],["tPractice","cPractice"]]){$("#"+t).onclick=()=>{document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));$("#"+t).classList.add("on");["cFree","cLearn","cPractice"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==c));};}
async function loadEngines(){try{const g=await (await fetch("/api/gemma")).json();const modes=[...g.engines.map(e=>e.engine)];if(g.engines.length>1)modes.push("both");
 $("#engines").innerHTML=modes.map(mo=>{const e=g.engines.find(x=>x.engine===mo);const on=g.mode===mo;
  const badges=e?`<span class="badge ${e.on_device?"dev":"lap"}">${e.on_device?"on-device":"laptop"}</span><span class="badge ${e.ok?"":"down"}">${e.model}${e.ok?(e.loaded&&e.loaded.includes(e.model)?" · loaded":""):" · unreachable"}</span>`:`<span class="badge">side by side</span>`;
  return `<div class="eng ${on?"on":""}" data-mode="${mo}"><b>${mo==="both"?"Both":mo}</b>${badges}</div>`;}).join("");
 document.querySelectorAll(".eng").forEach(el=>el.onclick=async()=>{await fetch("/api/gemma/select",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:el.dataset.mode})});loadEngines();});
 $("#engineNote").textContent=g.mode==="both"?"Coaching runs on every engine in parallel — compare answers and speed.":`Learn, coach, game and compose use “${g.mode}”.`;}catch(e){$("#engineNote").textContent="engine status unavailable";}}
pad();connect();loadEngines();setInterval(loadEngines,15000);
</script></body></html>
